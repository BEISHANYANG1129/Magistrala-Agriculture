name: Agriculture build and deployment checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  agriculture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: magistrala-ui/package-lock.json
      - name: Install locked dependencies
        working-directory: magistrala-ui
        run: npm ci
      - name: Build and check types
        working-directory: magistrala-ui
        run: npm run build
      - name: Frontend workflows
        working-directory: magistrala-ui
        run: npx vitest run
      - name: Encrypted session service
        working-directory: magistrala-ui
        run: node --test server/session-server.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: llm/agentv2/go.sum
      - name: Region agent
        working-directory: llm/agentv2
        run: |
          go test -p 1 ./...
          go vet ./...
      - name: Initialize fresh deployment and validate Compose
        run: |
          node scripts/deploy.mjs init
          node scripts/deploy.mjs init
          node scripts/deploy.mjs config
